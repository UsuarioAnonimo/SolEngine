<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#000000">
    <title>Sol Executor - Beta</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header class="main-header">
        <div class="logo">SOL EXECUTOR - BETA</div>
        <div class="dev-info">Dev: AreDev | gn375294@gmail.com</div>
    </header>

    <nav class="tab-menu">
        <button type="button" class="tab-btn active" onclick="switchTab('executor')">EXECUTOR</button>
        <button type="button" class="tab-btn" onclick="switchTab('console')">CONSOLE</button>
        <button type="button" class="tab-btn" onclick="switchTab('soltux')">SOLTUX</button>
    </nav>

    <main class="main-content">
        <aside id="project-explorer" class="project-explorer">
            <div class="explorer-header">
                <span class="explorer-title">Explorer</span>
                <button type="button" class="explorer-close" id="toggle-explorer-btn" aria-label="Toggle Explorer">☰</button>
            </div>

            <div class="project-panel">
                <label class="project-label" for="project-select">Projeto</label>
                <select id="project-select" class="project-select"></select>

                <div class="project-actions">
                    <button type="button" class="small-btn" id="new-project-btn">Novo</button>
                    <button type="button" class="small-btn" id="save-project-btn">Salvar</button>
                    <button type="button" class="small-btn danger" id="delete-project-btn">Excluir</button>
                </div>
            </div>

            <div class="explorer-toolbar">
                <button type="button" class="small-btn" id="new-file-btn">Arquivo</button>
                <button type="button" class="small-btn" id="new-folder-btn">Pasta</button>
                <button type="button" class="small-btn" id="import-project-btn">Importar</button>
            </div>

            <div id="project-tree" class="project-tree"></div>
        </aside>

        <div class="workspace-area">
            <section id="executor" class="content active">
                <div id="code-editor" contenteditable="true" spellcheck="false" role="textbox" aria-label="Editor de código Sol"></div>

                <footer class="editor-footer">
                    <button type="button" class="action-btn red" onclick="runSol()">RUN SCRIPT</button>
                    <button type="button" class="action-btn" onclick="toggleExplorer()">EXPLORER</button>
                    <button type="button" class="action-btn" onclick="document.getElementById('file-input').click()">IMPORT</button>
                    <button type="button" class="action-btn" onclick="exportProject()">EXPORT .sol</button>
                    <button type="button" class="action-btn" onclick="clearEditor()">CLEAR ALL</button>
                    <input type="file" id="file-input" accept=".sol,.Sol,.txt,.js,.json,.css,.html,.svg,.png,.jpg,.jpeg,.gif,.pdf" hidden onchange="handleFile(this)">
                </footer>
            </section>

            <section id="console" class="content">
                <div id="log-output"></div>
            </section>

            <section id="soltux" class="content">
                <div id="Soltux-display"></div>
                <input type="text" id="Soltux-input" placeholder="Digite um comando..." autocomplete="off" spellcheck="false">
            </section>
        </div>
    </main>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
